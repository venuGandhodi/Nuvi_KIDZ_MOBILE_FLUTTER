<style>
        .custom-shadow {
            box-shadow: 0 10px 30px -5px rgba(31, 61, 46, 0.08);
        }
        
        .floating-star {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px #fdb244;
            border-color: #fdb244;
        }
        
        .btn-bounce:hover {
            transform: translateY(-2px);
        }
        .btn-bounce:active {
            transform: translateY(1px);
        }
    </style>

<body class="bg-surface-container-low min-h-screen flex items-center justify-center font-body-md text-on-surface relative overflow-hidden p-margin-mobile md:p-margin-desktop">
<!-- Decorative Elements -->
<div class="absolute top-10 left-10 text-primary opacity-20 floating-star hidden md:block">
<span class="material-symbols-outlined text-4xl">star</span>
</div>
<div class="absolute bottom-20 right-20 text-secondary-container opacity-30 floating-star hidden md:block" style="animation-delay: 1s;">
<span class="material-symbols-outlined text-6xl">favorite</span>
</div>
<div class="absolute top-1/4 right-10 text-primary-fixed-dim opacity-40 floating-star hidden md:block" style="animation-delay: 2s;">
<span class="material-symbols-outlined text-5xl">cruelty_free</span>
</div>
<!-- Main Container -->
<div class="w-full max-w-md bg-surface rounded-3xl custom-shadow p-8 md:p-10 relative z-10 border border-surface-variant">
<!-- Header -->
<div class="text-center mb-8">
<div class="flex justify-center mb-6">
<img alt="Nuvi Kidz Logo" class="h-24 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAo9ll4g6EMqMn1Tkje8DhXlEExmqeGno90kV_3txVmiyp23Frpbj1kftYQrp3bGLOMGye_k6uGI-soUprdgiBTCTvRE_WmeXKbS1N_E3Y2sbrm04-Fjdt6JqRhVyUfcr8uzU9mFl2outCyYnkHDPAxhWVzxvywwMxbolwWbxMK_tsCS15tPJlbWxSbjva37CgbqiGDHv9eqOfUqiLj0doEL0PHPkIE_QSJEqptWL4vNsLVlsupoW0kA_Lpt9GNP1Zygz4"/>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">Join the NUVI Universe</h1>
<p class="text-on-surface-variant">Create an account to start your journey.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-5" method="POST">
<!-- Full Name -->
<div>
<label class="block text-label-sm font-label-sm text-primary mb-1 ml-1" for="fullName">Full Name</label>
<div class="relative rounded-xl border border-outline-variant bg-surface-bright input-focus-ring transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-none bg-transparent rounded-xl text-on-surface placeholder-outline focus:ring-0 sm:text-sm" id="fullName" name="fullName" placeholder="Alex Taylor" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block text-label-sm font-label-sm text-primary mb-1 ml-1" for="email">Email</label>
<div class="relative rounded-xl border border-outline-variant bg-surface-bright input-focus-ring transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-none bg-transparent rounded-xl text-on-surface placeholder-outline focus:ring-0 sm:text-sm" id="email" name="email" placeholder="alex@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block text-label-sm font-label-sm text-primary mb-1 ml-1" for="password">Password</label>
<div class="relative rounded-xl border border-outline-variant bg-surface-bright input-focus-ring transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-none bg-transparent rounded-xl text-on-surface placeholder-outline focus:ring-0 sm:text-sm" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</div>
</div>
</div>
<!-- Terms -->
<div class="flex items-start mt-4">
<div class="flex items-center h-5">
<input class="focus:ring-secondary-container h-4 w-4 text-primary border-outline-variant rounded bg-surface-bright" id="terms" name="terms" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="text-on-surface-variant font-body-md text-sm" for="terms">I agree to the <a class="text-primary underline hover:text-secondary-container transition-colors" href="#">Terms &amp; Conditions</a>.</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-label-sm font-label-sm text-on-background bg-secondary-container hover:bg-secondary-fixed focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary-container transition-all duration-200 btn-bounce mt-6" type="submit">
                Create Account
            </button>
</form>
<!-- Divider -->
<div class="mt-8 mb-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface text-outline font-label-sm">Or sign up with</span>
</div>
</div>
</div>
<!-- Social Sign Up -->
<div class="grid grid-cols-2 gap-4">
<a class="flex justify-center items-center py-2.5 px-4 border border-outline-variant rounded-xl shadow-sm bg-surface-bright text-on-surface hover:bg-surface-container-high transition-colors duration-200 btn-bounce" href="#">
<span class="material-symbols-outlined mr-2">code</span>
<span class="text-label-sm font-label-sm">Google</span>
</a>
<a class="flex justify-center items-center py-2.5 px-4 border border-outline-variant rounded-xl shadow-sm bg-surface-bright text-on-surface hover:bg-surface-container-high transition-colors duration-200 btn-bounce" href="#">
<span class="material-symbols-outlined mr-2">file_download</span>
<span class="text-label-sm font-label-sm">Apple</span>
</a>
</div>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant font-body-md text-sm">
                Already have an account? 
                <a class="text-primary font-label-sm text-label-sm hover:text-secondary-container hover:underline transition-colors ml-1" href="#">Sign In</a>
</p>
</div>
</div>
</body></html>
